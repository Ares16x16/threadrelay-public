[project]
name = "threadrelay-builder"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyinstaller==6.22.3",
  "hatchling==1.27.0",
  "pyinstaller-hooks-contrib==2026.9",
  "threadrelay-worker",
]

[tool.uv.sources]
threadrelay-worker = { path = "../worker" }

[tool.uv]
# Freeze the same runtime closure tested by worker/uv.lock.
constraint-dependencies = ["arrow==1.4.0", "attrs==26.1.0", "colorama==0.4.6", "fqdn==1.6.0", "greenlet==3.5.6", "idna==3.20", "iniconfig==2.3.1", "isoduration==20.11.0", "jsonpointer==3.6", "jsonschema==4.25.1", "jsonschema-specifications==2025.9.1", "packaging==26.3", "playwright==1.64.1", "pluggy==1.7.0", "pyee==14.0.0", "pygments==2.21.0", "python-dateutil==3.0.0", "referencing==0.37.0", "rfc3339-validator==0.1.4", "rfc3987==1.3.8", "rpds-py==2026.9.1", "six==1.17.0", "typing-extensions==4.16.0", "tzdata==2026.5", "uri-template==1.3.0", "webcolors==25.10.0"]
